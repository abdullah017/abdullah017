<svg width="1200" height="76" viewBox="0 0 1200 76" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="THE STACK">
  <defs>
    <linearGradient id="lE" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06B6D4"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></linearGradient>
    <linearGradient id="barE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06B6D4"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0.4"/></linearGradient>
    <linearGradient id="hbgE" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#0A1120"/><stop offset="1" stop-color="#070C18"/></linearGradient>
    <style>
      .bE{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .mE{font-family:'JetBrains Mono',Consolas,monospace}
      .numE{font-size:14px;font-weight:800;letter-spacing:3px;fill:#06B6D4}
      .ttlE{font-size:31px;font-weight:800;letter-spacing:3px;fill:#EAF2FB}
      .tagE{font-size:12px;font-weight:600;letter-spacing:2px;fill:#48586E}
      .inE{animation:inE .8s ease-out both}
      @keyframes inE{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
      .growE{animation:growE 1.2s ease-out .2s both;transform-origin:left}
      @keyframes growE{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      .dotE{animation:blE 2s ease-in-out infinite}
      @keyframes blE{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="76" rx="13" fill="url(#hbgE)"/>
  <rect x="0" y="0" width="5" height="76" rx="2.5" fill="url(#barE)"/>
  <circle class="dotE" cx="38" cy="38" r="4.5" fill="#06B6D4"/>
  <text class="bE numE inE" x="62" y="30">/ 02</text>
  <text class="bE ttlE inE" x="62" y="58">THE STACK</text>
  <rect class="growE" x="62" y="66" width="1076" height="2" fill="url(#lE)"/>
  <text class="mE tagE" x="1150" y="34" text-anchor="end">// tech.stack</text>
  <g opacity="0.5">
    <circle class="dotE" cx="1168" cy="52" r="2.5" fill="#06B6D4"/>
    <circle class="dotE" cx="1158" cy="52" r="2.5" fill="#06B6D4" style="animation-delay:.4s"/>
    <circle class="dotE" cx="1148" cy="52" r="2.5" fill="#06B6D4" style="animation-delay:.8s"/>
  </g>
</svg>
