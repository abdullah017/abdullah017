<svg width="1200" height="200" viewBox="0 0 1200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060B18"/>
      <stop offset="1" stop-color="#0A1224"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.33" stop-color="#8B5CF6"/>
      <stop offset="0.66" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#38BDF8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="fglow" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .base { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .big  { font-size: 34px; font-weight: 800; letter-spacing: 2px; fill: #F1F5F9; }
      .mid  { font-size: 17px; font-weight: 500; fill: #94A3B8; }
      .mail { font-size: 19px; font-weight: 700; letter-spacing: 1px; fill: #7DD3FC; }
      .up { animation: up 1s ease-out both; }
      .d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; }
      @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="1197" height="197" rx="18" fill="url(#fbg)" stroke="url(#border)" stroke-width="2.5"/>
  <rect x="1.5" y="1.5" width="1197" height="197" rx="18" fill="url(#fglow)"/>

  <text class="base big up" x="600" y="72" text-anchor="middle">LET&#8217;S BUILD SOMETHING EXCEPTIONAL<tspan class="cursor" fill="#38BDF8">_</tspan></text>
  <text class="base mid up d1" x="600" y="108" text-anchor="middle">Mobile products&#160;&#160;·&#160;&#160;Full-stack architecture&#160;&#160;·&#160;&#160;Mobile security audits&#160;&#160;·&#160;&#160;Team enablement</text>
  <text class="base mail up d2" x="600" y="148" text-anchor="middle">dev.abdullahtas@gmail.com</text>
  <text class="base mid up d3" x="600" y="178" text-anchor="middle" font-size="13" fill="#64748B">T&#220;RK&#304;YE&#160;&#160;·&#160;&#160;WORKING REMOTELY WITH TEAMS ACROSS EUROPE</text>
</svg>
