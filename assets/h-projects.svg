<svg width="1200" height="76" viewBox="0 0 1200 76" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FEATURED PROJECTS">
  <defs>
    <linearGradient id="lC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></linearGradient>
    <linearGradient id="barC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0.4"/></linearGradient>
    <linearGradient id="hbgC" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#0A1120"/><stop offset="1" stop-color="#070C18"/></linearGradient>
    <style>
      .bC{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .mC{font-family:'JetBrains Mono',Consolas,monospace}
      .numC{font-size:14px;font-weight:800;letter-spacing:3px;fill:#F59E0B}
      .ttlC{font-size:31px;font-weight:800;letter-spacing:3px;fill:#EAF2FB}
      .tagC{font-size:12px;font-weight:600;letter-spacing:2px;fill:#48586E}
      .inC{animation:inC .8s ease-out both}
      @keyframes inC{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
      .growC{animation:growC 1.2s ease-out .2s both;transform-origin:left}
      @keyframes growC{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      .dotC{animation:blC 2s ease-in-out infinite}
      @keyframes blC{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="76" rx="13" fill="url(#hbgC)"/>
  <rect x="0" y="0" width="5" height="76" rx="2.5" fill="url(#barC)"/>
  <circle class="dotC" cx="38" cy="38" r="4.5" fill="#F59E0B"/>
  <text class="bC numC inC" x="62" y="30">/ 03</text>
  <text class="bC ttlC inC" x="62" y="58">FEATURED PROJECTS</text>
  <rect class="growC" x="62" y="66" width="1076" height="2" fill="url(#lC)"/>
  <text class="mC tagC" x="1150" y="34" text-anchor="end">// portfolio</text>
  <g opacity="0.5">
    <circle class="dotC" cx="1168" cy="52" r="2.5" fill="#F59E0B"/>
    <circle class="dotC" cx="1158" cy="52" r="2.5" fill="#F59E0B" style="animation-delay:.4s"/>
    <circle class="dotC" cx="1148" cy="52" r="2.5" fill="#F59E0B" style="animation-delay:.8s"/>
  </g>
</svg>
