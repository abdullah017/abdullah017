<svg width="1200" height="76" viewBox="0 0 1200 76" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TECHNICAL WRITING">
  <defs>
    <linearGradient id="lF" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EC4899"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/></linearGradient>
    <linearGradient id="barF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EC4899"/><stop offset="1" stop-color="#EC4899" stop-opacity="0.4"/></linearGradient>
    <linearGradient id="hbgF" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#0A1120"/><stop offset="1" stop-color="#070C18"/></linearGradient>
    <style>
      .bF{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .mF{font-family:'JetBrains Mono',Consolas,monospace}
      .numF{font-size:14px;font-weight:800;letter-spacing:3px;fill:#EC4899}
      .ttlF{font-size:31px;font-weight:800;letter-spacing:3px;fill:#EAF2FB}
      .tagF{font-size:12px;font-weight:600;letter-spacing:2px;fill:#48586E}
      .inF{animation:inF .8s ease-out both}
      @keyframes inF{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
      .growF{animation:growF 1.2s ease-out .2s both;transform-origin:left}
      @keyframes growF{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      .dotF{animation:blF 2s ease-in-out infinite}
      @keyframes blF{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="76" rx="13" fill="url(#hbgF)"/>
  <rect x="0" y="0" width="5" height="76" rx="2.5" fill="url(#barF)"/>
  <circle class="dotF" cx="38" cy="38" r="4.5" fill="#EC4899"/>
  <text class="bF numF inF" x="62" y="30">/ 06</text>
  <text class="bF ttlF inF" x="62" y="58">TECHNICAL WRITING</text>
  <rect class="growF" x="62" y="66" width="1076" height="2" fill="url(#lF)"/>
  <text class="mF tagF" x="1150" y="34" text-anchor="end">// articles</text>
  <g opacity="0.5">
    <circle class="dotF" cx="1168" cy="52" r="2.5" fill="#EC4899"/>
    <circle class="dotF" cx="1158" cy="52" r="2.5" fill="#EC4899" style="animation-delay:.4s"/>
    <circle class="dotF" cx="1148" cy="52" r="2.5" fill="#EC4899" style="animation-delay:.8s"/>
  </g>
</svg>
