<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" fill="none" role="img" aria-label="Mobile open channel invitation: Bring me the hard part">
  <title>Bring Me the Hard Part — Mobile</title>
  <desc>A mobile-first invitation to collaborate on architecture, mobile security, and systems that can actually be operated.</desc>
  <defs>
    <pattern id="ocm-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#16150F" stroke-opacity=".08"/>
    </pattern>
    <style>
      .sans{font-family:'Space Grotesk',-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
      .label{font-size:24px;font-weight:800;letter-spacing:.7px}
      .headlineA{font-size:54px;font-weight:850;letter-spacing:-1.5px}
      .headlineB{font-size:68px;font-weight:900;letter-spacing:-2px}
      .support{font-size:24px;font-weight:750;letter-spacing:.1px}
      .panel{font-size:24px;font-weight:850;letter-spacing:1px}
    </style>
  </defs>
  <rect width="720" height="360" fill="#DCF343"/>
  <rect width="720" height="360" fill="url(#ocm-grid)"/>
  <rect x="1" y="1" width="718" height="358" stroke="#16150F" stroke-width="2"/>
  <path d="M22 24V12h12M686 12h12v12M22 336v12h12M686 348h12v-12" stroke="#16150F" stroke-width="2"/>

  <rect x="32" y="27" width="18" height="18" fill="#16150F"/>
  <text class="mono label" x="66" y="47" fill="#16150F">INBOUND / HIGH-CONSEQUENCE WORK</text>
  <text class="sans headlineA" x="30" y="112" fill="#16150F">BRING ME THE</text>
  <text class="sans headlineB" x="28" y="176" fill="#16150F">HARD PART.</text>
  <text class="sans support" x="32" y="219" fill="#16150F">architecture · mobile security</text>
  <text class="sans support" x="32" y="249" fill="#16150F">systems you can actually operate</text>

  <rect x="32" y="272" width="656" height="70" stroke="#16150F" stroke-width="2.5"/>
  <circle cx="54" cy="293" r="6" fill="#16150F"/>
  <text class="mono panel" x="76" y="302" fill="#16150F">OPEN CHANNEL</text>
  <text class="mono panel" x="54" y="331" fill="#16150F">SIGNAL / ACTIVE</text>
  <path d="M514 282v50" stroke="#16150F" stroke-width="2.5"/>
  <path d="M474 307h40M498 293l16 14-16 14" stroke="#16150F" stroke-width="3"/>
  <text class="sans" x="606" y="326" text-anchor="middle" font-size="58" font-weight="900" letter-spacing="-2" fill="#16150F">AT.</text>
</svg>
