<svg width="1200" height="76" viewBox="0 0 1200 76" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WHOAMI">
  <defs>
    <linearGradient id="lA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0.4"/></linearGradient>
    <linearGradient id="hbgA" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#0A1120"/><stop offset="1" stop-color="#070C18"/></linearGradient>
    <style>
      .bA{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .mA{font-family:'JetBrains Mono',Consolas,monospace}
      .numA{font-size:14px;font-weight:800;letter-spacing:3px;fill:#38BDF8}
      .ttlA{font-size:31px;font-weight:800;letter-spacing:3px;fill:#EAF2FB}
      .tagA{font-size:12px;font-weight:600;letter-spacing:2px;fill:#48586E}
      .inA{animation:inA .8s ease-out both}
      @keyframes inA{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
      .growA{animation:growA 1.2s ease-out .2s both;transform-origin:left}
      @keyframes growA{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      .dotA{animation:blA 2s ease-in-out infinite}
      @keyframes blA{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="76" rx="13" fill="url(#hbgA)"/>
  <rect x="0" y="0" width="5" height="76" rx="2.5" fill="url(#barA)"/>
  <circle class="dotA" cx="38" cy="38" r="4.5" fill="#38BDF8"/>
  <text class="bA numA inA" x="62" y="30">/ 01</text>
  <text class="bA ttlA inA" x="62" y="58">WHOAMI</text>
  <rect class="growA" x="62" y="66" width="1076" height="2" fill="url(#lA)"/>
  <text class="mA tagA" x="1150" y="34" text-anchor="end">// identity</text>
  <g opacity="0.5">
    <circle class="dotA" cx="1168" cy="52" r="2.5" fill="#38BDF8"/>
    <circle class="dotA" cx="1158" cy="52" r="2.5" fill="#38BDF8" style="animation-delay:.4s"/>
    <circle class="dotA" cx="1148" cy="52" r="2.5" fill="#38BDF8" style="animation-delay:.8s"/>
  </g>
</svg>
