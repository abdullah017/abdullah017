<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering manifesto">
<defs>
 <linearGradient id="mbg" x1="0" y1="0" x2="1200" y2="430"><stop offset="0" stop-color="#070C18"/><stop offset="1" stop-color="#04070F"/></linearGradient>
 <style>
  .b{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
  .m{font-family:'JetBrains Mono',Consolas,monospace}
  .idx{font-size:14px;font-weight:800;letter-spacing:2px}
  .hd{font-size:23px;font-weight:800;letter-spacing:1.5px;fill:#EAF2FB}
  .dc{font-size:14px;font-weight:400;fill:#8FA3B8}
  .cap{font-size:13px;font-weight:700;letter-spacing:5px;fill:#4FD1C5}

.row0{animation:rev .9s ease-out 0.5s both}
.row1{animation:rev .9s ease-out 1.2s both}
.row2{animation:rev .9s ease-out 1.9s both}
.row3{animation:rev .9s ease-out 2.5999999999999996s both}
@keyframes rev{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
  .bar{animation:bar 1s ease-out both;transform-origin:top}
  @keyframes bar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .cur{animation:cur 1s steps(1) infinite}@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
 </style>
</defs>
<rect width="1200" height="430" rx="16" fill="url(#mbg)"/>
<rect x="1" y="1" width="1198" height="428" rx="16" fill="none" stroke="#16233A" stroke-width="1.5"/>
<g opacity="0.05" stroke="#334155" stroke-width="1">
<path d="M0 0v430"/>
<path d="M60 0v430"/>
<path d="M120 0v430"/>
<path d="M180 0v430"/>
<path d="M240 0v430"/>
<path d="M300 0v430"/>
<path d="M360 0v430"/>
<path d="M420 0v430"/>
<path d="M480 0v430"/>
<path d="M540 0v430"/>
<path d="M600 0v430"/>
<path d="M660 0v430"/>
<path d="M720 0v430"/>
<path d="M780 0v430"/>
<path d="M840 0v430"/>
<path d="M900 0v430"/>
<path d="M960 0v430"/>
<path d="M1020 0v430"/>
<path d="M1080 0v430"/>
<path d="M1140 0v430"/>
</g>
<text class="m cap" x="48" y="52">// ENGINEERING&#160;&#160;CREED</text>
<rect class="cur" x="322" y="41" width="8" height="15" fill="#4FD1C5"/>
<g class="row0">
<rect class="bar" x="48" y="96" width="4" height="56" rx="2" fill="#38BDF8"/>
<text class="m idx" x="70" y="118" fill="#38BDF8">01</text>
<text class="b hd" x="112" y="118">ARCHITECTURE IS A PROMISE</text>
<text class="b dc" x="112" y="142">Every abstraction I write is a contract with the engineer who reads it next — including future me.</text>
</g>
<g class="row1">
<rect class="bar" x="48" y="174" width="4" height="56" rx="2" fill="#8B5CF6"/>
<text class="m idx" x="70" y="196" fill="#8B5CF6">02</text>
<text class="b hd" x="112" y="196">SELF-HOST BY DEFAULT</text>
<text class="b dc" x="112" y="220">I'd rather own my stack on bare metal than rent someone else's magic. Control is a feature.</text>
</g>
<g class="row2">
<rect class="bar" x="48" y="252" width="4" height="56" rx="2" fill="#F59E0B"/>
<text class="m idx" x="70" y="274" fill="#F59E0B">03</text>
<text class="b hd" x="112" y="274">SECURITY IS THE FOUNDATION</text>
<text class="b dc" x="112" y="298">Not a checkbox at the end. Pinning, hardening, and threat-modelling live at layer zero.</text>
</g>
<g class="row3">
<rect class="bar" x="48" y="330" width="4" height="56" rx="2" fill="#10B981"/>
<text class="m idx" x="70" y="352" fill="#10B981">04</text>
<text class="b hd" x="112" y="352">MARGINAL OVER MAINSTREAM</text>
<text class="b dc" x="112" y="376">Bun before it was safe. Cutting-edge isn't a risk to me — it's where the leverage is.</text>
</g>
</svg>