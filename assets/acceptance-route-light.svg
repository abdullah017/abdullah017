<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-label="Acceptance route from real users through mobile, security, services, and owned infrastructure">
  <title>Acceptance Route — End-to-End Ownership</title>
  <desc>A single engineering route connects real users, the mobile edge, the trust boundary, service core, and owned infrastructure.</desc>
  <defs>
    <pattern id="arl-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" stroke="#6D6A5E" stroke-opacity=".11"/>
    </pattern>
    <style>
      .sans{font-family:'Space Grotesk',-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
      .heading{font-size:29px;font-weight:800;letter-spacing:.6px}
      .subhead{font-size:16px;font-weight:700;letter-spacing:1.1px}
      .micro{font-size:12px;font-weight:700;letter-spacing:1.1px}
      .station{font-size:19px;font-weight:800;letter-spacing:.4px}
      .detail{font-size:16px;font-weight:650;letter-spacing:.1px}
      .criterion{font-size:20px;font-weight:850;letter-spacing:.6px}
      .packet{animation:arl-flow 7s linear infinite;transform-box:fill-box;transform-origin:center}
      @keyframes arl-flow{from{transform:translateX(0)}to{transform:translateX(750px)}}
      @media (prefers-reduced-motion:reduce){.packet{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="420" fill="#F4F0E6"/>
  <rect width="1200" height="420" fill="url(#arl-grid)"/>
  <rect x="1" y="1" width="1198" height="418" stroke="#16150F" stroke-width="2"/>

  <rect x="28" y="25" width="16" height="16" fill="#DCF343" stroke="#16150F" stroke-width="1.5"/>
  <text class="sans heading" x="58" y="53" fill="#16150F">ACCEPTANCE ROUTE</text>
  <text class="mono subhead" x="370" y="51" fill="#2742E6">/ END-TO-END OWNERSHIP</text>
  <text class="mono micro" x="1165" y="50" text-anchor="end" fill="#6D6A5E">AT-AC-05 / FIELD TEST</text>
  <path d="M28 77H1172" stroke="#16150F" stroke-width="2"/>
  <text class="mono micro" x="48" y="105" fill="#6D6A5E">INPUT / UNCONTROLLED REALITY</text>
  <text class="mono micro" x="1152" y="105" text-anchor="end" fill="#6D6A5E">OUTPUT / OPERABLE SYSTEM</text>

  <path d="M100 171H1100" stroke="#2742E6" stroke-width="3"/>
  <g fill="#2742E6">
    <path d="M222 164l10 7-10 7zM472 164l10 7-10 7zM722 164l10 7-10 7zM972 164l10 7-10 7z"/>
  </g>

  <g>
    <circle cx="100" cy="171" r="43" fill="#F4F0E6" stroke="#2742E6" stroke-width="3"/>
    <path d="M100 134v10M100 198v10M63 171h10M127 171h10" stroke="#6D6A5E" stroke-width="1.5"/>
    <circle cx="100" cy="157" r="9" stroke="#16150F" stroke-width="3"/>
    <path d="M80 191c3-15 11-22 20-22s17 7 20 22" stroke="#16150F" stroke-width="3" stroke-linecap="square"/>
    <rect x="68" y="135" width="18" height="16" fill="#DCF343" stroke="#16150F" stroke-width="1.5"/>
    <text class="mono micro" x="77" y="147" text-anchor="middle" fill="#16150F">01</text>
  </g>
  <g>
    <rect x="307" y="128" width="86" height="86" fill="#F4F0E6" stroke="#2742E6" stroke-width="3"/>
    <rect x="333" y="140" width="34" height="61" rx="4" stroke="#16150F" stroke-width="3"/>
    <path d="M339 149h22M339 188h22" stroke="#16150F" stroke-width="2"/>
    <circle cx="350" cy="195" r="2.5" fill="#2742E6"/>
    <path d="M322 154l-7 7 7 7M378 174l7 7-7 7" stroke="#6D6A5E" stroke-width="2"/>
    <rect x="315" y="136" width="18" height="16" fill="#DCF343" stroke="#16150F" stroke-width="1.5"/>
    <text class="mono micro" x="324" y="148" text-anchor="middle" fill="#16150F">02</text>
  </g>
  <g>
    <path d="M600 124l40 23v47l-40 23-40-23v-47z" fill="#F4F0E6" stroke="#2742E6" stroke-width="3"/>
    <path d="M600 143l24 9v17c0 16-9 27-24 33-15-6-24-17-24-33v-17z" stroke="#16150F" stroke-width="3"/>
    <path d="M589 171l8 8 16-18" stroke="#2742E6" stroke-width="4"/>
    <rect x="565" y="136" width="18" height="16" fill="#DCF343" stroke="#16150F" stroke-width="1.5"/>
    <text class="mono micro" x="574" y="148" text-anchor="middle" fill="#16150F">03</text>
  </g>
  <g>
    <circle cx="850" cy="171" r="43" fill="#F4F0E6" stroke="#2742E6" stroke-width="3"/>
    <path d="M833 146l-13 25 13 25M867 146l13 25-13 25" stroke="#16150F" stroke-width="3"/>
    <path d="M842 158h16M842 171h16M842 184h16" stroke="#2742E6" stroke-width="2"/>
    <circle cx="850" cy="158" r="3" fill="#16150F"/>
    <circle cx="850" cy="171" r="3" fill="#16150F"/>
    <circle cx="850" cy="184" r="3" fill="#16150F"/>
    <rect x="818" y="135" width="18" height="16" fill="#DCF343" stroke="#16150F" stroke-width="1.5"/>
    <text class="mono micro" x="827" y="147" text-anchor="middle" fill="#16150F">04</text>
  </g>
  <g>
    <rect x="1057" y="128" width="86" height="86" fill="#F4F0E6" stroke="#2742E6" stroke-width="3"/>
    <rect x="1073" y="143" width="54" height="17" stroke="#16150F" stroke-width="2.5"/>
    <rect x="1073" y="164" width="54" height="17" stroke="#16150F" stroke-width="2.5"/>
    <rect x="1073" y="185" width="54" height="17" stroke="#16150F" stroke-width="2.5"/>
    <g fill="#2742E6"><circle cx="1081" cy="151.5" r="2.5"/><circle cx="1081" cy="172.5" r="2.5"/><circle cx="1081" cy="193.5" r="2.5"/></g>
    <path d="M1089 152h28M1089 173h28M1089 194h28" stroke="#6D6A5E" stroke-width="1.5"/>
    <rect x="1065" y="136" width="18" height="16" fill="#DCF343" stroke="#16150F" stroke-width="1.5"/>
    <text class="mono micro" x="1074" y="148" text-anchor="middle" fill="#16150F">05</text>
  </g>

  <rect class="packet" x="215" y="164" width="14" height="14" rx="2" fill="#DCF343" stroke="#16150F" stroke-width="2"/>

  <text class="sans station" x="100" y="245" text-anchor="middle" fill="#16150F">REAL USERS</text>
  <text class="mono detail" x="100" y="270" text-anchor="middle" fill="#6D6A5E">latency · offline</text>
  <text class="mono detail" x="100" y="289" text-anchor="middle" fill="#6D6A5E">chaos</text>
  <text class="sans station" x="350" y="245" text-anchor="middle" fill="#16150F">MOBILE EDGE</text>
  <text class="mono detail" x="350" y="270" text-anchor="middle" fill="#6D6A5E">Flutter · Dart</text>
  <text class="mono detail" x="350" y="289" text-anchor="middle" fill="#6D6A5E">Kotlin · Swift</text>
  <text class="sans station" x="600" y="245" text-anchor="middle" fill="#16150F">TRUST BOUNDARY</text>
  <text class="mono detail" x="600" y="270" text-anchor="middle" fill="#6D6A5E">OWASP · pinning</text>
  <text class="mono detail" x="600" y="289" text-anchor="middle" fill="#6D6A5E">secrets</text>
  <text class="sans station" x="850" y="245" text-anchor="middle" fill="#16150F">SERVICE CORE</text>
  <text class="mono detail" x="850" y="270" text-anchor="middle" fill="#6D6A5E">Bun · Hono</text>
  <text class="mono detail" x="850" y="289" text-anchor="middle" fill="#6D6A5E">REST · GraphQL</text>
  <text class="sans station" x="1100" y="245" text-anchor="middle" fill="#16150F">OWNED INFRA</text>
  <text class="mono detail" x="1100" y="270" text-anchor="middle" fill="#6D6A5E">Postgres · Docker</text>
  <text class="mono detail" x="1100" y="289" text-anchor="middle" fill="#6D6A5E">Linux · Coolify</text>

  <g>
    <rect x="48" y="330" width="344" height="62" fill="#DCF343" stroke="#16150F" stroke-width="2"/>
    <path d="M70 360l8 8 15-18" stroke="#16150F" stroke-width="4"/>
    <text class="sans criterion" x="108" y="368" fill="#16150F">FEELS NATIVE</text>
    <text class="mono micro" x="376" y="350" text-anchor="end" fill="#16150F">AC-01</text>
    <rect x="428" y="330" width="344" height="62" fill="#DCF343" stroke="#16150F" stroke-width="2"/>
    <path d="M450 360l8 8 15-18" stroke="#16150F" stroke-width="4"/>
    <text class="sans criterion" x="488" y="368" fill="#16150F">FAILS SAFELY</text>
    <text class="mono micro" x="756" y="350" text-anchor="end" fill="#16150F">AC-02</text>
    <rect x="808" y="330" width="344" height="62" fill="#DCF343" stroke="#16150F" stroke-width="2"/>
    <path d="M830 360l8 8 15-18" stroke="#16150F" stroke-width="4"/>
    <text class="sans criterion" x="868" y="368" fill="#16150F">CAN BE OPERATED</text>
    <text class="mono micro" x="1136" y="350" text-anchor="end" fill="#16150F">AC-03</text>
  </g>
</svg>
